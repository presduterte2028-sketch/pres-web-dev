            0 2px 0 #8a6d1e,
            0 8px 22px rgba(212,175,55,0.35),
            0 0 0 1px rgba(0,0,0,0.2) inset;
          transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
          cursor:pointer;
          text-transform:uppercase;
          white-space:nowrap;
        }
        .btn-gold:hover{transform:translateY(-1px); filter:brightness(1.05); box-shadow:0 3px 0 #8a6d1e, 0 12px 28px rgba(212,175,55,0.45)}
        .btn-gold:active{transform:translateY(1px); box-shadow:0 1px 0 #8a6d1e, 0 4px 12px rgba(212,175,55,0.3)}
        .btn-small{padding:11px 18px; font-size:13px}
        .hero-cta{padding:18px; display:flex; justify-content:center; background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 100%)}
        .section{margin:36px auto 0; max-width:1100px}
        .section-head{display:flex; align-items:center; gap:12px; margin:0 0 16px}
        .section-head .line{height:1px; flex:1; background:linear-gradient(90deg, rgba(212,175,55,0.5), transparent)}
        .section-head h2{margin:0; font-size:13px; letter-spacing:0.18em; color:#d4af37; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; text-transform:uppercase}
        .packages{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
        @media(max-width:860px){.packages{grid-template-columns:1fr}}
        .pkg{
          background:linear-gradient(180deg, rgba(18,32,18,0.9) 0%, rgba(10,20,10,0.96) 100%);
          border:1px solid rgba(212,175,55,0.22);
          border-radius:14px;
          padding:18px 18px 16px;
          position:relative;
          overflow:hidden;
          box-shadow:0 8px 30px rgba(0,0,0,0.35);
        }
        .pkg.popular{
          border-color:#d4af37;
          box-shadow:0 0 0 1px rgba(212,175,55,0.3) inset, 0 0 28px rgba(212,175,55,0.18), 0 12px 40px rgba(0,0,0,0.5);
          transform:translateY(-2px);
        }
        .pkg .badge{
          position:absolute; top:12px; right:12px;
          background:#d4af37; color:#000; font-size:10px; font-weight:800; letter-spacing:0.08em;
          padding:5px 9px; border-radius:999px;
          font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .pkg h3{margin:0; font-size:14px; letter-spacing:0.12em; color:#9be49b; font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
        .pkg .price{margin:10px 0 12px; font-size:32px; font-weight:800; color:#fff; line-height:1}
        .pkg .price small{font-size:14px; font-weight:600; color:#d4af37; margin-left:6px}
        .pkg ul{margin:0 0 16px; padding:0; list-style:none; display:grid; gap:8px}
        .pkg li{display:flex; gap:8px; font-size:13px; color:#cde9cd; line-height:1.35}
        .pkg li::before{content:'✓'; color:#3eff7a; font-weight:700; margin-top:1px}
        .behind{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
        @media(max-width:700px){.behind{grid-template-columns:1fr}}
        .feat{
          background:rgba(12,24,12,0.8);
          border:1px solid rgba(0,255,100,0.14);
          border-radius:12px; padding:16px;
          display:flex; gap:12px;
        }
        .feat .ic{
          width:36px; height:36px; border-radius:9px;
          background:linear-gradient(180deg, rgba(212,175,55,0.18), rgba(0,255,100,0.12));
          border:1px solid rgba(212,175,55,0.28);
          display:grid; place-items:center; color:#d4af37; font-size:18px; flex-shrink:0;
        }
        .feat h4{margin:0 0 4px; font-size:13px; color:#fff}
        .feat p{margin:0; font-size:12.5px; color:#a8cda8; line-height:1.45}
        .freebies{
          background:linear-gradient(180deg, rgba(212,175,55,0.08) 0%, rgba(12,24,12,0.9) 100%);
          border:1px solid rgba(212,175,55,0.24);
          border-radius:14px; padding:18px;
        }
        .freebies ul{margin:0; padding:0; list-style:none; display:grid; gap:10px}
        .freebies li{display:flex; gap:10px; align-items:flex-start; font-size:13px; color:#e8ffe8}
        .freebies li span.icon{color:#d4af37; margin-top:1px}
        .sticky{
          position:fixed; left:0; right:0; bottom:0; z-index:20;
          background:rgba(7,13,7,0.92);
          backdrop-filter:blur(12px);
          border-top:1px solid rgba(212,175,55,0.28);
          padding:10px 16px;
          padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
          display:flex; justify-content:center; align-items:center; gap:14px;
          box-shadow:0 -8px 30px rgba(0,0,0,0.45);
        }
        .sticky p{margin:0; font-size:11px; letter-spacing:0.12em; color:#9be49b; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; display:none}
        @media(min-width:600px){.sticky p{display:block}}
        .trust{
          text-align:center; margin-top:18px; font-size:11px; color:#7aaa7a; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:0.06em
        }
        .divider{height:1px; background:linear-gradient(90deg, transparent, rgba(212,175,55,0.25), transparent); margin:28px 0}
